# Nix - flake checks, package builds, format check
#
# Runs on every push to feature branches when Nix-related files change.
#
# Darwin is included: `macos-latest` is an Apple Silicon (arm64) image, so it
# provides aarch64-darwin coverage. This matters because the module has
# platform-conditional behaviour (e.g. the macosKeychain certificate source),
# which would otherwise only ever be evaluated on a developer laptop.
# Note x64 macOS now requires an explicit `-intel`/`-large` label suffix.

name: Nix

on:
  push:
    branches-ignore:
      - main
    paths:
      # Nix-level files (includes examples/**/*.nix via the glob)
      - '**/*.nix'
      - 'flake.lock'
      # Files the Nix package build reads (via uv2nix)
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'VERSION'
      # Self-trigger on workflow changes
      - '.github/workflows/nix.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix Check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Verify runner system matches matrix
        # `nix flake check` implicitly targets builtins.currentSystem, while the
        # matrix `system` value is only a label. GitHub's `-latest` images migrate
        # between OS versions and have changed architecture labelling before, so
        # assert the two agree rather than silently checking the wrong system.
        run: |
          actual="$(nix eval --impure --raw --expr 'builtins.currentSystem')"
          echo "declared=${{ matrix.system }} actual=$actual"
          if [ "$actual" != "${{ matrix.system }}" ]; then
            echo "::error::Runner system mismatch: matrix declares ${{ matrix.system }} but runner is $actual"
            exit 1
          fi

      - name: Run flake check
        run: nix flake check --print-build-logs

  # Separate job for building packages to ensure they work
  build:
    name: Build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build iam-ra-cli
        run: nix build .#iam-ra-cli --print-build-logs

      - name: Verify CLI runs
        run: nix run .#iam-ra-cli -- --help

  # Format check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check Nix formatting
        run: |
          nix fmt -- --check $(git ls-files '*.nix')

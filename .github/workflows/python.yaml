# Python - pytest, mypy, ruff, CLI smoke test
#
# Runs on every push to feature branches when Python source, tests, deps,
# or the Python version changes. Nix package build coverage is handled by
# nix.yaml (which also triggers on src/**) rather than duplicated here.
#
# Tests run on Linux and macOS. macOS coverage is required because some
# KeyStore backends are platform-specific (the macosKeychain backend shells out
# to /usr/bin/security), so Linux-only CI would leave them untested. Type
# checking and linting are platform-independent and run on Linux only.

name: Python

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/python.yaml'

jobs:
  test:
    name: Python Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64).
        runner:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/iam_ra_cli --cov-report=xml

      - name: Type check
        if: matrix.runner == 'ubuntu-latest'
        run: uv run mypy src/iam_ra_cli --ignore-missing-imports

      - name: Lint
        if: matrix.runner == 'ubuntu-latest'
        run: uv run ruff check src/iam_ra_cli

      - name: Verify CLI loads
        run: uv run iam-ra --help

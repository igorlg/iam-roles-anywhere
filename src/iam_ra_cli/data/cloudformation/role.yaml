AWSTemplateFormatVersion: "2010-09-09"
Description: IAM Roles Anywhere - IAM Role and Profile

Parameters:
  Namespace:
    Type: String
    Description: Namespace identifier

  RoleName:
    Type: String
    Description: Logical name for this role

  PolicyArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional managed policy ARNs to attach

  TrustAnchorArn:
    Type: String
    Description: ARN of the IAM Roles Anywhere Trust Anchor for this role's scope

  SessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: >-
      IAM session duration in seconds. Must be at least 3600 because it is used
      for AWS::IAM::Role.MaxSessionDuration, which AWS requires to be >= 3600.
      The same value is used for AWS::RolesAnywhere::Profile.DurationSeconds.

  AllowedSubjectCN:
    Type: String
    Default: "*"
    Description: >-
      Which host certificates may assume this role, matched against the
      certificate subject Common Name with StringLike (so "web-*" works).
      Default "*" means any certificate under the scope's trust anchor, which is
      the historical behaviour; the condition is then omitted entirely rather
      than being written as a wildcard match.

      IAM Roles Anywhere populates aws:PrincipalTag/x509Subject/CN from the
      authenticating certificate by default. Note that setting a custom
      attributeMappings on the Profile which omits the Subject CN specifier
      would drop the tag, and a StringLike condition on an absent tag evaluates
      FALSE - i.e. this role would stop being assumable. This template sets no
      attribute mappings, so the default mapping applies.

Outputs:
  Version:
    Description: Template version
    Value: "3.0.0-dev.1"

  RoleArn:
    Description: IAM Role ARN
    Value: !GetAtt Role.Arn

  ProfileArn:
    Description: IAM Roles Anywhere Profile ARN
    Value: !GetAtt Profile.ProfileArn

Conditions:
  HasPolicies: !Not [!Equals [!Join ["", !Ref PolicyArns], ""]]
  # Only restrict when asked. With the default "*" the trust policy is emitted
  # exactly as it was before this parameter existed - no new condition key -
  # so upgrading cannot change who can assume an existing role.
  RestrictSubjectCN: !Not [!Equals [!Ref AllowedSubjectCN, "*"]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "iam-ra-${Namespace}-${RoleName}"
      MaxSessionDuration: !Ref SessionDuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            # aws:SourceArn pins the trust anchor, which is what scopes a role
            # to one CA. On its own it lets ANY certificate under that CA assume
            # this role; AllowedSubjectCN narrows that to specific hosts.
            Condition: !If
              - RestrictSubjectCN
              - ArnEquals:
                  aws:SourceArn: !Ref TrustAnchorArn
                StringLike:
                  aws:PrincipalTag/x509Subject/CN: !Ref AllowedSubjectCN
              - ArnEquals:
                  aws:SourceArn: !Ref TrustAnchorArn
      ManagedPolicyArns: !If
        - HasPolicies
        - !Ref PolicyArns
        - !Ref AWS::NoValue
      Tags:
        - Key: iam-ra:namespace
          Value: !Ref Namespace
        - Key: iam-ra:role
          Value: !Ref RoleName

  Profile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Sub "iam-ra-${Namespace}-${RoleName}"
      Enabled: true
      DurationSeconds: !Ref SessionDuration
      RoleArns:
        - !GetAtt Role.Arn
      Tags:
        - Key: iam-ra:namespace
          Value: !Ref Namespace
        - Key: iam-ra:role
          Value: !Ref RoleName
